<!--
  Mark for the Antigravity plugin. Deliberately an original geometric device —
  a mass rising off its plane — not Google's Antigravity brand logo, which is
  trademarked and not ours to redistribute.

  This is the dark-surface variant (light strokes). See antigravity-light.svg
  for the twin used on light surfaces; the panel walks to that one first when
  the surface is bright.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="#cacccc" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round">
  <ellipse cx="12" cy="18" rx="7.25" ry="2.75" opacity="0.55"/>
  <path d="M12 14.5V4.25"/>
  <path d="M8.4 7.85 12 4.25l3.6 3.6"/>
</svg>
